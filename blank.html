<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Gemini Studio - Blank</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; height: 100vh; display: flex; flex-direction: column; }
    
    /* 상단 탑바 */
    header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-left h1 { font-size: 18px; font-weight: 700; color: #2563eb; }
    .nav-btns button { padding: 6px 12px; cursor: pointer; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; font-size: 13px; }
    
    .key-bar { display: flex; gap: 8px; align-items: center; background: #f1f5f9; padding: 6px 12px; border-radius: 20px; font-size: 13px; }
    .key-bar input { border: 1px solid #cbd5e1; border-radius: 12px; padding: 4px 10px; font-size: 12px; width: 180px; }
    .key-bar button { background: #2563eb; color: #fff; border: none; border-radius: 12px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
    
    /* 메인 컨테이너 */
    .container { flex: 1; display: flex; max-width: 100%; width: 100%; margin: 0 auto; overflow: hidden; padding: 16px 20px 24px; gap: 16px; }
    
    /* 채팅창 메인 */
    .chat-panel { flex: 1; display: flex; flex-direction: column; background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: hidden; }
    
    /* 모델 & 대상 컨트롤러 */
    .chat-header { padding: 12px 20px; border-bottom: 1px solid #f1f5f9; display: flex; gap: 12px; align-items: center; background: #fafafa; }
    .chat-header select { padding: 6px 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 13px; background: #fff; }
    
    /* 메시지 스트림 */
    .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
    .msg { display: flex; gap: 12px; max-width: 85%; line-height: 1.6; font-size: 14.5px; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.ai { align-self: flex-start; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; flex-shrink: 0; }
    .msg.user .avatar { background: #2563eb; color: #fff; }
    .msg.ai .avatar { background: #10b981; color: #fff; }
    .bubble { padding: 12px 16px; border-radius: 14px; word-break: break-word; }
    .msg.user .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
    .msg.ai .bubble { background: #f1f5f9; color: #1e293b; border-bottom-left-radius: 4px; border: 1px solid #e2e8f0; }
    
    /* 파일 다운로드 카드 */
    .file-card { margin-top: 10px; padding: 10px 14px; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .file-card button { background: #059669; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
    
    /* 파일 첨부 미리보기 칩 */
    .attachment-preview { padding: 6px 20px; display: flex; gap: 8px; flex-wrap: wrap; background: #fff; border-top: 1px solid #f1f5f9; }
    .file-chip { display: flex; align-items: center; gap: 6px; background: #e2e8f0; padding: 4px 10px; border-radius: 12px; font-size: 12px; }
    .file-chip span { cursor: pointer; color: #ef4444; font-weight: bold; }

    /* 입력 바 (Gemini 스타일) */
    .input-wrapper { padding: 16px 20px; background: #fff; border-top: 1px solid #e2e8f0; }
    .input-box { display: flex; align-items: flex-end; gap: 8px; background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 20px; padding: 8px 14px; }
    .input-box:focus-within { border-color: #2563eb; background: #fff; }
    textarea { flex: 1; border: none; background: transparent; outline: none; resize: none; font-size: 14px; line-height: 20px; max-height: 120px; height: 24px; padding: 2px 0; }
    .action-btn { background: none; border: none; cursor: pointer; font-size: 18px; color: #64748b; padding: 4px; display: flex; align-items: center; }
    .action-btn:hover { color: #2563eb; }
    .send-btn { background: #2563eb; color: #fff; border-radius: 50%; width: 32px; height: 32px; justify-content: center; font-size: 14px; }
    .send-btn:hover { background: #1d4ed8; color: #fff; }

    /* 우측 코드 + 미리보기 분할 패널 */
    .side-panel { flex: 1; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
    .split-card { flex: 1; display: flex; flex-direction: column; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; overflow: hidden; }
    .split-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 8px; }
    #contextText { flex: 1; width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 12px; font-family: monospace; resize: none; }
    #indexPreview { flex: 1; width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Gemini Studio</h1>
      <div class="nav-btns">
        <button onclick="location.href='index.html'">index.html 보기</button>
      </div>
    </div>
    <div class="key-bar">
      <label>🔑 API 키:</label>
      <input type="password" id="apiKeyInput" placeholder="서버 등록할 API 키" />
      <button id="saveKeyBtn">등록</button>
      <span id="keyStatus">확인 중...</span>
    </div>
  </header>

  <div class="container">
    <div class="chat-panel">
      <!-- 상단 컨트롤러 -->
      <div class="chat-header">
        <label style="font-size: 13px; font-weight: 600;">모델:</label>
        <select id="modelSelect">
          <option value="gemini-3.8-flash" selected>Gemini 3.8 Flash (메인)</option>
          <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (초경량)</option>
          <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro (유료·preview)</option>
          <option value="gemini-4-argon">Gemini 4 Argon (유료·실험)</option>
        </select>
        
        <label style="font-size: 13px; font-weight: 600; margin-left: 10px;">작업 모드:</label>
        <select id="actionMode">
          <option value="chat">일반 대화 및 파일 생성</option>
          <option value="modify-index">index.html 직접 수정</option>
        </select>
      </div>

      <!-- 채팅 메시지 영역 -->
      <div class="chat-messages" id="chatMessages">
        <div class="msg ai">
          <div class="avatar">G</div>
          <div class="bubble">
            안녕하세요! 무엇을 도와드릴까요?<br>
            대화, 코드 생성, 파일 첨부 분석 및 <code>index.html</code> 직접 수정이 가능합니다.
          </div>
        </div>
      </div>

      <!-- 파일 첨부 칩 -->
      <div class="attachment-preview" id="attachmentPreview" style="display: none;"></div>

      <!-- 입력창 (Gemini 스타일) -->
      <div class="input-wrapper">
        <div class="input-box">
          <label class="action-btn" title="파일 첨부 (이미지/텍스트)">
            📎
            <input type="file" id="fileInput" multiple style="display: none;" />
          </label>
          <textarea id="chatInput" placeholder="메시지를 입력하거나 파일을 드래그/붙여넣기(Ctrl+V)하세요..."></textarea>
          <button class="action-btn send-btn" id="sendBtn">➤</button>
        </div>
      </div>
    </div>

    <!-- 우측 코드 + 실시간 미리보기 패널 -->
    <div class="side-panel">
      <div class="split-card">
        <div class="split-header">
          <span>📄 index.html 소스 코드</span>
          <button id="reloadIndexBtn" style="padding: 4px 10px; font-size: 12px; cursor: pointer; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 6px;">새로고침</button>
        </div>
        <textarea id="contextText" readonly placeholder="불러오는 중..."></textarea>
      </div>
      <div class="split-card">
        <div class="split-header">
          <span>🖥️ index.html 실시간 미리보기</span>
        </div>
        <iframe id="indexPreview" src="index.html"></iframe>
      </div>
    </div>
  </div>

  <script>
    let attachedFiles = [];

    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const keyStatus = document.getElementById('keyStatus');
    const modelSelect = document.getElementById('modelSelect');
    const actionMode = document.getElementById('actionMode');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');
    const attachmentPreview = document.getElementById('attachmentPreview');
    const contextText = document.getElementById('contextText');
    const reloadIndexBtn = document.getElementById('reloadIndexBtn');

    // 1. 서버 상태 & index.html 내용 동기화
    async function checkStatus() {
      try {
        const r = await fetch('/api/key/status');
        const d = await r.json();
        keyStatus.innerText = d.hasKey ? '🟢 서버 연결됨' : '🔴 API 키 미등록';
      } catch {
        keyStatus.innerText = '🔴 서버 오프라인';
      }
    }
    checkStatus();

    async function loadIndexCode() {
      try {
        const r = await fetch('/api/page/index');
        const d = await r.json();
        contextText.value = d.content || '';
        const frame = document.getElementById('indexPreview');
        if (frame) frame.src = 'index.html?t=' + Date.now();
      } catch {}
    }
    loadIndexCode();
    reloadIndexBtn.onclick = loadIndexCode;

    // 2. API 키 등록
    saveKeyBtn.onclick = async () => {
      const key = apiKeyInput.value.trim();
      if (!key) return alert('API 키를 입력하세요');
      const res = await fetch('/api/key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ apiKey: key })
      });
      const d = await res.json();
      if (d.hasKey) {
        keyStatus.innerText = '🟢 서버 연결됨';
        apiKeyInput.value = '';
        alert('서버 메모리에 안전하게 등록되었습니다.');
      }
    };

    // 3. 파일 첨부 및 클립보드 붙여넣기 (Ctrl+V)
    function renderAttachments() {
      attachmentPreview.innerHTML = '';
      if (attachedFiles.length === 0) {
        attachmentPreview.style.display = 'none';
        return;
      }
      attachmentPreview.style.display = 'flex';
      attachedFiles.forEach((f, idx) => {
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        chip.innerHTML = `📄 ${f.name} <span onclick="removeFile(${idx})">×</span>`;
        attachmentPreview.appendChild(chip);
      });
    }

    window.removeFile = (idx) => {
      attachedFiles.splice(idx, 1);
      renderAttachments();
    };

    fileInput.onchange = (e) => {
      Array.from(e.target.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (evt) => {
          attachedFiles.push({ name: file.name, type: file.type, content: evt.target.result });
          renderAttachments();
        };
        reader.readAsText(file);
      });
    };

    // 클립보드 붙여넣기 감지
    chatInput.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (const item of items) {
        if (item.kind === 'file') {
          const file = item.getAsFile();
          const reader = new FileReader();
          reader.onload = (evt) => {
            attachedFiles.push({ name: file.name || 'clipboard-data.txt', type: file.type, content: evt.target.result });
            renderAttachments();
          };
          reader.readAsText(file);
        }
      }
    });

    // 4. 메시지 추가 및 파일 다운로드 카드 파싱
    function appendMsg(role, text, fileData = null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${role}`;
      
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerText = role === 'user' ? 'U' : 'G';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = text.replace(/\n/g, '<br>');

      // 파일 생성 다운로드 카드
      if (fileData) {
        const card = document.createElement('div');
        card.className = 'file-card';
        card.innerHTML = `
          <div><strong>📄 ${fileData.filename}</strong><div style="font-size:11px;color:#64748b;">생성된 파일</div></div>
          <button onclick="downloadFile('${fileData.filename}', \`${encodeURIComponent(fileData.content)}\`)">📥 다운로드</button>
        `;
        bubble.appendChild(card);
      }

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(bubble);
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    window.downloadFile = (filename, encodedContent) => {
      const content = decodeURIComponent(encodedContent);
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
    };

    // 5. 전송 처리
    async function handleSend() {
      const text = chatInput.value.trim();
      if (!text && attachedFiles.length === 0) return;

      let promptPayload = text;
      if (attachedFiles.length > 0) {
        promptPayload += '\n\n[첨부 파일 목록]\n' + attachedFiles.map(f => `--- ${f.name} ---\n${f.content.slice(0, 1500)}`).join('\n');
      }

      appendMsg('user', text + (attachedFiles.length > 0 ? ` (📎 ${attachedFiles.length}개 파일 동봉)` : ''));
      chatInput.value = '';
      attachedFiles = [];
      renderAttachments();

      const loadingMsg = document.createElement('div');
      loadingMsg.className = 'msg ai';
      loadingMsg.innerHTML = '<div class="avatar">G</div><div class="bubble">생각 중...</div>';
      chatMessages.appendChild(loadingMsg);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        if (actionMode.value === 'modify-index') {
          // index.html 패치 제안 모드 (자동 적용 금지 -> 승인 후 적용 & 되돌리기)
          const res = await fetch('/api/ai-modify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              target: 'index',
              instruction: promptPayload,
              currentContent: contextText.value,
              model: modelSelect.value
            })
          });
          const d = await res.json();
          loadingMsg.remove();
          if (!d.ok || !d.patch) {
            appendMsg('ai', `❌ 패치 생성 실패: ${d.error || '오류 발생'}`);
          } else if (d.patch.type === 'question') {
            appendMsg('ai', `❓ [추가 확인 질문]\n${d.patch.question}`);
          } else if (d.patch.type === 'patch') {
            appendPatchCard(d.patch);
          }
        } else {
          // 일반 대화 및 파일 생성 모드
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: promptPayload,
              pageContext: contextText.value,
              model: modelSelect.value
            })
          });
          const d = await res.json();
          loadingMsg.remove();
          
          const reply = d.reply || d.text || (d.error ? ('❌ ' + d.error) : '응답이 없습니다.');
          
          // 응답 안에 코드블록이 있으면 파일 다운로드 생성
          const codeMatch = reply.match(/```([a-zA-Z0-9]+)?\n([\s\S]*?)```/);
          let fileData = null;
          if (codeMatch) {
            const ext = codeMatch[1] || 'txt';
            fileData = { filename: `generated-output.${ext}`, content: codeMatch[2] };
          }
          appendMsg('ai', reply, fileData);
        }
      } catch (e) {
        loadingMsg.remove();
        appendMsg('ai', `오류 발생: ${e.message}`);
      }
    }

    // 기본 모델을 동작 확인된 gemini-3.5-flash-lite, 기본 모드를 패치 모드로 설정
    if (modelSelect.querySelector('option[value="gemini-3.5-flash-lite"]')) {
      modelSelect.value = 'gemini-3.5-flash-lite';
    }
    actionMode.value = 'modify-index';

    function escapeHtml(str) {
      return String(str || '')
        .split('&').join('&amp;')
        .split('<').join('&lt;')
        .split('>').join('&gt;');
    }

    function appendPatchCard(patch) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg ai';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerText = 'G';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      const existsNow = contextText.value.includes(patch.search);
      bubble.innerHTML = `
        <div style="font-weight:700; margin-bottom:6px;">🛠️ 패치 제안 (${escapeHtml(patch.target || 'index.html')})</div>
        <div style="font-size:13px; margin-bottom:8px;">${escapeHtml(patch.explanation || '')}</div>
        <div style="font-size:11px; color:#dc2626; font-weight:600; margin-bottom:2px;">- 찾을 조각 (search) ${existsNow ? '✅ 매치됨' : '⚠️ 원본에 없음'}</div>
        <pre style="background:#fee2e2; color:#991b1b; padding:8px; border-radius:6px; font-size:12px; overflow-x:auto; white-space:pre-wrap; margin-bottom:8px;">${escapeHtml(patch.search)}</pre>
        <div style="font-size:11px; color:#059669; font-weight:600; margin-bottom:2px;">+ 바꿀 조각 (replace)</div>
        <pre style="background:#dcfce7; color:#166534; padding:8px; border-radius:6px; font-size:12px; overflow-x:auto; white-space:pre-wrap; margin-bottom:10px;">${escapeHtml(patch.replace)}</pre>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="apply-patch-btn" style="background:#2563eb; color:#fff; border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600;">✅ 적용</button>
          <button class="undo-patch-btn" disabled style="background:#64748b; color:#fff; border:none; padding:6px 14px; border-radius:6px; cursor:not-allowed; font-size:12px; font-weight:600; opacity:0.5;">↩️ 되돌리기</button>
          <span class="patch-status" style="font-size:12px; color:#475569;">승인 대기 중 (미적용)</span>
        </div>
      `;

      const applyBtn = bubble.querySelector('.apply-patch-btn');
      const undoBtn = bubble.querySelector('.undo-patch-btn');
      const statusSpan = bubble.querySelector('.patch-status');
      let backupContent = null;

      applyBtn.onclick = async () => {
        await loadIndexCode();
        const current = contextText.value;
        if (!current.includes(patch.search)) {
          statusSpan.style.color = '#dc2626';
          statusSpan.innerText = '❌ 원본에서 search 조각을 찾을 수 없습니다.';
          return;
        }
        backupContent = current;
        const updated = current.replace(patch.search, () => patch.replace);
        const r = await fetch('/api/page/index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: updated })
        });
        const resData = await r.json();
        if (resData.ok) {
          await loadIndexCode();
          applyBtn.disabled = true;
          applyBtn.style.opacity = '0.5';
          applyBtn.style.cursor = 'not-allowed';
          undoBtn.disabled = false;
          undoBtn.style.opacity = '1';
          undoBtn.style.cursor = 'pointer';
          undoBtn.style.background = '#ea580c';
          statusSpan.style.color = '#059669';
          statusSpan.innerText = '✅ 적용 완료';
        } else {
          statusSpan.style.color = '#dc2626';
          statusSpan.innerText = '❌ 저장 실패: ' + (resData.error || '오류');
        }
      };

      undoBtn.onclick = async () => {
        if (backupContent === null) return;
        const r = await fetch('/api/page/index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: backupContent })
        });
        const resData = await r.json();
        if (resData.ok) {
          await loadIndexCode();
          undoBtn.disabled = true;
          undoBtn.style.opacity = '0.5';
          undoBtn.style.cursor = 'not-allowed';
          undoBtn.style.background = '#64748b';
          applyBtn.disabled = false;
          applyBtn.style.opacity = '1';
          applyBtn.style.cursor = 'pointer';
          statusSpan.style.color = '#ea580c';
          statusSpan.innerText = '↩️ 되돌리기 완료';
        } else {
          statusSpan.style.color = '#dc2626';
          statusSpan.innerText = '❌ 복원 실패: ' + (resData.error || '오류');
        }
      };

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(bubble);
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    sendBtn.onclick = handleSend;
    chatInput.onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    };
  </script>
</body>
</html>
