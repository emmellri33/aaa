<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Gemini Studio - Cockpit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
    
    header { background: #1e293b; border-bottom: 1px solid #334155; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 16px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    
    .nav-tabs { display: flex; gap: 4px; }
    .tab-btn { background: transparent; border: none; color: #94a3b8; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 6px; transition: all 0.2s; }
    .tab-btn:hover { background: #334155; color: #f8fafc; }
    .tab-btn.active { background: #0284c7; color: #ffffff; }

    .main-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .tab-pane { flex: 1; display: none; flex-direction: column; height: 100%; overflow: hidden; padding: 16px; gap: 12px; }
    .tab-pane.active { display: flex; }

    /* Terminal Tab */
    .term-subtabs { display: flex; gap: 4px; border-bottom: 1px solid #334155; padding-bottom: 8px; align-items: center; }
    .subtab-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 4px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .subtab-btn.active { background: #0369a1; color: #fff; border-color: #0284c7; }
    .subtab-close { font-size: 10px; cursor: pointer; border-radius: 50%; padding: 0 2px; }
    .subtab-close:hover { background: #ef4444; color: #fff; }
    .term-display { flex: 1; background: #020617; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 13px; overflow-y: auto; white-space: pre-wrap; color: #38bdf8; }
    .term-input-row { display: flex; gap: 8px; }
    .term-input { flex: 1; background: #020617; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; color: #fff; font-family: monospace; font-size: 13px; }
    .term-input:focus { outline: none; border-color: #38bdf8; }

    /* Files Tab */
    .files-layout { flex: 1; display: flex; gap: 12px; height: 100%; overflow: hidden; }
    .files-sidebar { width: 220px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
    .file-item { padding: 6px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; color: #cbd5e1; word-break: break-all; }
    .file-item:hover { background: #334155; color: #fff; }
    .file-item.active { background: #0284c7; color: #fff; }
    .file-editor-area { flex: 1; display: flex; flex-direction: column; gap: 8px; height: 100%; }
    .editor-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #94a3b8; }
    .editor-textarea { flex: 1; background: #020617; border: 1px solid #334155; border-radius: 6px; padding: 12px; color: #f8fafc; font-family: monospace; font-size: 13px; resize: none; }
    .editor-textarea:focus { outline: none; border-color: #38bdf8; }

    /* Commit Tab */
    .commit-layout { display: flex; flex-direction: column; gap: 12px; height: 100%; max-width: 800px; margin: 0 auto; width: 100%; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .card-title { font-size: 13px; font-weight: 600; color: #94a3b8; }
    .pre-box { background: #020617; border: 1px solid #334155; border-radius: 4px; padding: 8px; font-family: monospace; font-size: 12px; max-height: 180px; overflow-y: auto; white-space: pre-wrap; color: #cbd5e1; }

    .btn { background: #0284c7; color: #fff; border: none; border-radius: 4px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #0369a1; }
    .btn.danger { background: #ef4444; }
    .btn.danger:hover { background: #dc2626; }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <span>🛠️ Gemini Studio Cockpit</span>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchMainTab('termTab')">💻 터미널</button>
      <button class="tab-btn" onclick="switchMainTab('filesTab')">📁 파일 편집</button>
      <button class="tab-btn" onclick="switchMainTab('commitTab')">🌿 커밋 관리</button>
    </div>
  </header>

  <div class="main-container">
    <!-- 1. 터미널 탭 -->
    <div class="tab-pane active" id="termTab">
      <div class="term-subtabs" id="termSubTabs">
        <button class="btn" style="padding: 2px 8px; font-size: 11px;" onclick="addTerminalSession()">＋ 탭 추가</button>
      </div>
      <div class="term-display" id="termDisplay"></div>
      <div class="term-input-row">
        <input type="text" class="term-input" id="termInput" placeholder="명령어 입력 (예: git status, git log --oneline -5, grep body index.html)" onkeydown="if(event.key==='Enter') runActiveTerminal()" />
        <button class="btn" onclick="runActiveTerminal()">실행</button>
      </div>
    </div>

    <!-- 2. 파일 편집 탭 -->
    <div class="tab-pane" id="filesTab">
      <div class="files-layout">
        <div class="files-sidebar" id="filesList">
          <div style="font-size: 11px; color: #64748b; padding: 4px;">파일 목록 불러오는 중...</div>
        </div>
        <div class="file-editor-area">
          <div class="editor-header">
            <span id="currentFileName">파일을 선택하세요</span>
            <button class="btn" id="saveFileBtn" onclick="saveCurrentFile()" style="display: none;">💾 저장하기</button>
          </div>
          <textarea class="editor-textarea" id="fileEditor" placeholder="내용 없음" disabled></textarea>
        </div>
      </div>
    </div>

    <!-- 3. 커밋 탭 -->
    <div class="tab-pane" id="commitTab">
      <div class="commit-layout">
        <div class="card">
          <div class="card-title">📌 변경 파일 현황 (git status --short)</div>
          <div class="pre-box" id="gitStatusPre">불러오는 중...</div>
        </div>
        <div class="card">
          <div class="card-title">✍️ 새 커밋 작성</div>
          <div style="display: flex; gap: 8px;">
            <input type="text" class="term-input" id="commitMessageInput" placeholder="커밋 메시지 입력..." />
            <button class="btn" onclick="submitCommit()">커밋</button>
          </div>
          <div id="commitResultMsg" style="font-size: 12px; margin-top: 4px;"></div>
        </div>
        <div class="card">
          <div class="card-title">📜 최근 커밋 이력 (최근 5건)</div>
          <div class="pre-box" id="gitLogPre">불러오는 중...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- 탭 전환 로직 ---
    function switchMainTab(tabId) {
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      document.querySelectorAll(".tab-pane").forEach(pane => pane.classList.remove("active"));
      
      const pane = document.getElementById(tabId);
      if (pane) pane.classList.add("active");

      // 활성화된 탭 버튼 스타일
      if (tabId === "termTab") document.querySelectorAll(".tab-btn")[0].classList.add("active");
      if (tabId === "filesTab") {
        document.querySelectorAll(".tab-btn")[1].classList.add("active");
        loadWorkspaceFiles();
      }
      if (tabId === "commitTab") {
        document.querySelectorAll(".tab-btn")[2].classList.add("active");
        loadGitStatus();
      }
    }

    // --- 1. 터미널 탭 로직 ---
    let termSessions = [];
    let activeSessionId = null;

    function addTerminalSession() {
      const id = "term_" + Date.now();
      const num = termSessions.length + 1;
      const session = {
        id,
        name: `터미널 ${num}`,
        history: `[${sessionTitle(num)}] 세션 준비됨.\nallowlist 명령: git status, git log --oneline -5, tail /tmp/server.log, curl health, grep ...\n\n`
      };
      termSessions.push(session);
      renderTerminalTabs();
      switchTerminalSession(id);
    }

    function sessionTitle(idx) {
      return `세션 #${idx}`;
    }

    function renderTerminalTabs() {
      const container = document.getElementById("termSubTabs");
      container.innerHTML = `<button class="btn" style="padding: 2px 8px; font-size: 11px;" onclick="addTerminalSession()">＋ 탭 추가</button>`;
      
      termSessions.forEach(sess => {
        const btn = document.createElement("button");
        btn.className = "subtab-btn" + (sess.id === activeSessionId ? " active" : "");
        btn.innerHTML = `<span>${sess.name}</span><span class="subtab-close" onclick="closeTerminalSession(event, '${sess.id}')">×</span>`;
        btn.onclick = () => switchTerminalSession(sess.id);
        container.insertBefore(btn, container.lastChild);
      });
    }

    function switchTerminalSession(id) {
      activeSessionId = id;
      renderTerminalTabs();
      const sess = termSessions.find(s => s.id === id);
      const display = document.getElementById("termDisplay");
      if (sess) {
        display.innerText = sess.history;
        display.scrollTop = display.scrollHeight;
      }
    }

    function closeTerminalSession(e, id) {
      e.stopPropagation();
      if (termSessions.length <= 1) return alert("최소 1개의 터미널 세션은 유지되어야 합니다.");
      termSessions = termSessions.filter(s => s.id !== id);
      if (activeSessionId === id) {
        activeSessionId = termSessions[0].id;
      }
      renderTerminalTabs();
      switchTerminalSession(activeSessionId);
    }

    async function runActiveTerminal() {
      const input = document.getElementById("termInput");
      const cmd = input.value.trim();
      if (!cmd) return;
      input.value = "";

      const sess = termSessions.find(s => s.id === activeSessionId);
      if (!sess) return;

      sess.history += `$ ${cmd}\n`;
      const display = document.getElementById("termDisplay");
      display.innerText = sess.history;
      display.scrollTop = display.scrollHeight;

      try {
        const res = await fetch("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cmd })
        });
        const d = await res.json();
        const out = d.output || d.error || "(결과 없음)";
        sess.history += `${out}\n\n`;
      } catch (err) {
        sess.history += `[통신 에러]: ${err.message}\n\n`;
      }

      display.innerText = sess.history;
      display.scrollTop = display.scrollHeight;
    }

    // --- 2. 파일 편집 탭 로직 ---
    let currentSelectedFile = null;

    async function loadWorkspaceFiles() {
      const listEl = document.getElementById("filesList");
      try {
        const r = await fetch("/api/files");
        const d = await r.json();
        listEl.innerHTML = "";
        if (!d.ok || !d.files) {
          listEl.innerHTML = `<div style="font-size: 11px; color: #ef4444; padding: 4px;">파일 로드 실패</div>`;
          return;
        }

        d.files.forEach(f => {
          const item = document.createElement("div");
          item.className = "file-item" + (f.name === currentSelectedFile ? " active" : "");
          item.innerText = `📄 ${f.name}`;
          item.onclick = () => selectFileToEdit(f.name);
          listEl.appendChild(item);
        });
      } catch (e) {
        listEl.innerHTML = `<div style="font-size: 11px; color: #ef4444; padding: 4px;">에러: ${e.message}</div>`;
      }
    }

    async function selectFileToEdit(filename) {
      currentSelectedFile = filename;
      loadWorkspaceFiles();

      const label = document.getElementById("currentFileName");
      const editor = document.getElementById("fileEditor");
      const saveBtn = document.getElementById("saveFileBtn");

      label.innerText = `📄 ${filename} (불러오는 중...)`;
      editor.disabled = true;
      saveBtn.style.display = "none";

      try {
        const r = await fetch("/api/files/read?name=" + encodeURIComponent(filename));
        const d = await r.json();
        if (d.ok) {
          label.innerText = `📄 ${filename}`;
          editor.value = d.content || "";
          editor.disabled = false;
          saveBtn.style.display = "inline-block";
        } else {
          label.innerText = `❌ ${filename} 로드 실패: ` + (d.error || "오류");
          editor.value = "";
        }
      } catch (e) {
        label.innerText = `❌ 오류: ` + e.message;
        editor.value = "";
      }
    }

    async function saveCurrentFile() {
      if (!currentSelectedFile) return;
      const editor = document.getElementById("fileEditor");
      const content = editor.value;
      const saveBtn = document.getElementById("saveFileBtn");

      saveBtn.disabled = true;
      saveBtn.innerText = "저장 중...";

      try {
        let endpoint = "/api/files/write";
        let body = { name: currentSelectedFile, content };

        // 시스템 파일(blank/cockpit) 전용 라우트 활용
        if (currentSelectedFile === "blank.html" || currentSelectedFile === "cockpit.html") {
          endpoint = "/api/cockpit/target";
          body = { file: currentSelectedFile, content };
        }

        const r = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const d = await r.json();
        if (d.ok) {
          alert(`✅ ${currentSelectedFile} 저장 완료 (스냅샷 생성됨)`);
        } else {
          alert(`❌ 저장 실패: ` + (d.error || "알 수 없는 오류"));
        }
      } catch (e) {
        alert("❌ 저장 요청 중 예외: " + e.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "💾 저장하기";
      }
    }

    // --- 3. 커밋 탭 로직 ---
    async function loadGitStatus() {
      const statusPre = document.getElementById("gitStatusPre");
      const logPre = document.getElementById("gitLogPre");
      const msgEl = document.getElementById("commitResultMsg");
      msgEl.innerText = "";

      try {
        const r = await fetch("/api/git/status");
        const d = await r.json();
        if (d.ok) {
          statusPre.innerText = d.status || "(변경 사항 없음)";
          logPre.innerText = d.log || "(커밋 이력 없음)";
        } else {
          statusPre.innerText = "상태 조회 실패";
          logPre.innerText = "이력 조회 실패";
        }
      } catch (e) {
        statusPre.innerText = "에러: " + e.message;
        logPre.innerText = "에러: " + e.message;
      }
    }

    async function submitCommit() {
      const input = document.getElementById("commitMessageInput");
      const message = input.value.trim();
      const msgEl = document.getElementById("commitResultMsg");

      if (!message) {
        msgEl.style.color = "#ef4444";
        msgEl.innerText = "커밋 메시지를 입력하세요.";
        return;
      }

      msgEl.style.color = "#94a3b8";
      msgEl.innerText = "커밋 실행 중...";

      try {
        const r = await fetch("/api/git/commit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const d = await r.json();
        if (d.ok) {
          msgEl.style.color = "#22c55e";
          msgEl.innerText = `✅ 커밋 완료: ${d.message || "성공"}`;
          input.value = "";
          loadGitStatus();
        } else {
          msgEl.style.color = "#ef4444";
          msgEl.innerText = `❌ 커밋 실패: ${d.error || "오류"}`;
        }
      } catch (e) {
        msgEl.style.color = "#ef4444";
        msgEl.innerText = `❌ 예외 발생: ` + e.message;
      }
    }

    // 초기화
    addTerminalSession();
  </script>
</body>
</html>
